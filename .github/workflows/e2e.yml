name: MADAR Browser E2E

on:
  pull_request:

jobs:
  customers-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: madar_test
          POSTGRES_USER: madar
          POSTGRES_PASSWORD: madar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U madar -d madar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: madar_test
      POSTGRES_USER: madar
      POSTGRES_PASSWORD: madar_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ci-browser-secret-key-not-for-production
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Apply database migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Start API
        working-directory: apps/api
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/madar-api.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/madar-api.log
          exit 1

      - name: Install web and browser dependencies
        working-directory: apps/web
        run: |
          npm install --legacy-peer-deps
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Start web
        working-directory: apps/web
        run: |
          nohup npm start -- -H 0.0.0.0 -p 3000 > /tmp/madar-web.log 2>&1 &
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/madar-web.log
          exit 1

      - name: Customers EPIC 2 browser verification
        working-directory: apps/web
        run: node tests/e2e/customers-epic2.cjs

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "--- API log ---"
          cat /tmp/madar-api.log || true
          echo "--- Web log ---"
          cat /tmp/madar-web.log || true
