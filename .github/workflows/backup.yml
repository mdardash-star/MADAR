name: MADAR Scheduled Backup

on:
  schedule:
    - cron: "0 2 * * *"    # Daily at 2:00 AM UTC
  workflow_dispatch:        # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=()
          [ -z "${{ secrets.PROD_HOST }}" ]     && missing+=("PROD_HOST")
          [ -z "${{ secrets.PROD_USER }}" ]     && missing+=("PROD_USER")
          [ -z "${{ secrets.PROD_SSH_KEY }}" ]  && missing+=("PROD_SSH_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Required secrets are not configured: ${missing[*]}"
            echo "Please add the following secrets to the repository or 'production' environment:"
            for s in "${missing[@]}"; do echo "  - $s"; done
            exit 1
          fi

      - name: Run database backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/madar
            S3_BACKUP_BUCKET=${{ secrets.S3_BACKUP_BUCKET }} \
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            bash scripts/backup.sh
            echo "Backup completed: $(date)"

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚨 CRITICAL: MADAR daily backup FAILED — $(date). Manual intervention required!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
