name: MADAR CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # ─── Backend: Lint + Test ───────────────────────────────────────────────────
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: madar_test
          POSTGRES_USER: madar
          POSTGRES_PASSWORD: madar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: madar_test
      POSTGRES_USER: madar
      POSTGRES_PASSWORD: madar_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required so lint can compare the current change set
          # with its base without making legacy lint debt block every PR.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint changed Python files (ruff)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi

          mapfile -t CHANGED_PYTHON < <(
            git diff --name-only --diff-filter=ACMR --relative=apps/api \
              "$BASE_SHA" "$GITHUB_SHA" -- apps/api \
              | grep -E '\.py$' || true
          )

          if [ "${#CHANGED_PYTHON[@]}" -eq 0 ]; then
            echo "No changed backend Python files to lint."
            exit 0
          fi

          printf 'Linting changed backend files:\n - %s\n' "${CHANGED_PYTHON[@]}"
          ruff check "${CHANGED_PYTHON[@]}"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q --tb=short

      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --ignore-vuln PYSEC-2022-42969 || true  # Non-blocking for now

  # ─── Frontend: Build + Type Check ──────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Security audit (npm audit)
        run: npm audit --audit-level=critical || true  # Non-blocking for now

  # ─── Docker: Build Images ───────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/madar-api:latest
            ghcr.io/${{ github.repository_owner }}/madar-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/madar-web:latest
            ghcr.io/${{ github.repository_owner }}/madar-web:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Staging (auto on develop branch) ─────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.madar.app
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/madar
            git pull origin develop
            docker compose -f docker-compose.prod.yml pull api web
            docker compose -f docker-compose.prod.yml up -d --no-deps api
            sleep 10
            curl -f http://localhost:8000/health || exit 1
            docker compose -f docker-compose.prod.yml exec -T api alembic upgrade head
            docker compose -f docker-compose.prod.yml up -d --no-deps web
            echo "✅ Staging deploy complete"

      - name: Notify Slack — staging deployed
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} Staging deploy: ${{ job.status }} — ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

  # ─── Deploy to Production (manual approval on main branch) ──────────────────
  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://app.madar.app
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/madar
            git pull origin main
            # Take pre-deploy backup
            bash scripts/backup.sh || echo "WARNING: Pre-deploy backup failed"
            # Rolling restart
            docker compose -f docker-compose.prod.yml pull api web
            docker compose -f docker-compose.prod.yml up -d --no-deps api
            # Health check loop (5 retries)
            for i in 1 2 3 4 5; do
              sleep 10
              curl -f http://localhost:8000/health && break
              if [ $i -eq 5 ]; then
                echo "❌ Health check failed — rolling back"
                docker compose -f docker-compose.prod.yml rollout api
                exit 1
              fi
            done
            # Apply migrations
            docker compose -f docker-compose.prod.yml exec -T api alembic upgrade head
            # Deploy web
            docker compose -f docker-compose.prod.yml up -d --no-deps web
            sleep 5
            curl -f http://localhost:8000/health || exit 1
            echo "✅ Production deploy complete: ${{ github.sha }}"

      - name: Notify Slack — production deployed
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '🚀' || '🚨' }} Production deploy: ${{ job.status }} — ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
