# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Main application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.madar.app;

    # SSL certificates (Let's Encrypt via Certbot)
    ssl_certificate     /etc/letsencrypt/live/app.madar.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.madar.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS — force HTTPS for 1 year (include subdomains)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.madar.app;" always;

    # Request ID for tracing
    add_header X-Request-ID $request_id always;

    # Connection limit per IP
    limit_conn conn_limit 20;

    # Global rate limit
    limit_req zone=global_limit burst=20 nodelay;

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass         http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;

        # Cache static Next.js assets
        location /_next/static/ {
            proxy_pass http://web:3000;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # --- API (FastAPI) ---
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID $request_id;
        proxy_read_timeout 30s;

        # Prevent sensitive headers from leaking
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # Auth endpoints — stricter rate limit
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID $request_id;
    }

    # Company registration — strict rate limit
    location /companies/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health check — no rate limiting
    location /health {
        proxy_pass http://api:8000;
        access_log off;
        proxy_read_timeout 5s;
    }

    # Prometheus metrics — BLOCKED from public internet
    location /metrics {
        deny all;
        return 403;
    }

    # API docs — disabled in production
    # To enable for debugging: comment out the deny below
    location ~ ^/(docs|redoc|openapi\.json) {
        deny all;
        return 404;
    }

    # Custom error pages
    error_page 429 /429.json;
    error_page 502 503 504 /503.json;
    location = /429.json {
        internal;
        return 429 '{"error":"rate_limit_exceeded","message":"Too many requests. Please try again later."}';
        add_header Content-Type application/json;
    }
    location = /503.json {
        internal;
        return 503 '{"error":"service_unavailable","message":"Service temporarily unavailable."}';
        add_header Content-Type application/json;
    }
}

