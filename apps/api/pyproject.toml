[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# test_release_v01.py predates the incremental-lint gate and carries three
# pre-existing style violations (F401/E501). Keep all other Ruff rules active
# there while new/changed customer files remain fully linted.
[tool.ruff.lint.per-file-ignores]
"tests/test_release_v01.py" = ["E501", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
